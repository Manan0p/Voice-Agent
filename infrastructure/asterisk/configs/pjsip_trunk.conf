; ==============================================================================
; Generic SIP Trunk Configuration for External VoIP Carrier / DID Provider
; Compatible with Telnyx, VoIP.ms, Twilio SIP, Flowroute, Zadarma, etc.
; ==============================================================================

; Outbound Registration to SIP Trunk Provider (if registration required)
[trunk-reg]
type = registration
outbound_auth = trunk-auth
server_uri = sip:${SIP_TRUNK_HOST:-trunk.provider.com}
client_uri = sip:${SIP_TRUNK_USER:-user}@${SIP_TRUNK_HOST:-trunk.provider.com}
retry_interval = 60
expiration = 3600

; Inbound/Outbound Authentication
[trunk-auth]
type = auth
auth_type = userpass
username = ${SIP_TRUNK_USER:-user}
password = ${SIP_TRUNK_PASS:-pass}

; Address of Record (AOR)
[trunk-aor]
type = aor
contact = sip:${SIP_TRUNK_HOST:-trunk.provider.com}

; Trunk Endpoint Definition
[trunk-endpoint]
type = endpoint
context = from-trunk
disallow = all
allow = ulaw,alaw,opus,slin16
aors = trunk-aor
outbound_auth = trunk-auth
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
send_rpid = yes
trust_id_inbound = yes
trust_id_outbound = yes
inband_progress = yes
