[global]
type = global
user_agent = VoiceAgentPBX

; ==============================
; Transports
; ==============================
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0:8088

; ==============================
; Softphone Endpoint 1001 (Caller)
; ==============================
[1001]
type = endpoint
context = from-internal
disallow = all
allow = ulaw,alaw,opus
auth = auth1001
aors = aor1001
direct_media = no

[auth1001]
type = auth
auth_type = userpass
password = softphone_pass_1001
username = 1001

[aor1001]
type = aor
max_contacts = 2
remove_existing = yes

; ==============================
; Softphone Endpoint 1002 (User / Escalation Target)
; ==============================
[1002]
type = endpoint
context = from-internal
disallow = all
allow = ulaw,alaw,opus
auth = auth1002
aors = aor1002
direct_media = no

[auth1002]
type = auth
auth_type = userpass
password = softphone_pass_1002
username = 1002

[aor1002]
type = aor
max_contacts = 2
remove_existing = yes

; ==============================
; AI Agent Virtual Endpoint
; ==============================
[agent-endpoint]
type = endpoint
context = from-internal
disallow = all
allow = ulaw,alaw,slin16
direct_media = no

; ==============================
; SIP Trunking & External DID Providers
; ==============================
#include pjsip_trunk.conf

