[general]
static = yes
writeprotect = yes
clearglobalvars = no

[from-internal]
; Dial extension 1000 or agent to enter Stasis application
exten => 1000,1,NoOp(Incoming call to Voice Agent from ${CALLERID(all)})
 same => n,Answer()
 same => n,Stasis(voice_agent_app)
 same => n,Hangup()

exten => agent,1,NoOp(Incoming call to Voice Agent via named extension)
 same => n,Answer()
 same => n,Stasis(voice_agent_app)
 same => n,Hangup()

; Direct call to user softphone 1002
exten => 1002,1,NoOp(Direct call to user ${EXTEN})
 same => n,Dial(PJSIP/1002,30)
 same => n,Hangup()

; Catch-all default inbound route -> Stasis Voice Agent
exten => _[0-9+X].,1,NoOp(Catch-all call to ${EXTEN} entering Voice Agent)
 same => n,Set(DIVERSION=${PJSIP_HEADER(read,Diversion)})
 same => n,Set(PAI=${PJSIP_HEADER(read,P-Asserted-Identity)})
 same => n,Answer()
 same => n,Stasis(voice_agent_app,${CALLERID(num)},${DIVERSION},${PAI})
 same => n,Hangup()

; ==============================
; Inbound Route for External SIP Trunk / Carrier Forwarded Calls
; ==============================
[from-trunk]
exten => _[0-9+X].,1,NoOp(Inbound Call from SIP Trunk: DID=${EXTEN}, Caller=${CALLERID(all)})
 same => n,Set(DIVERSION=${PJSIP_HEADER(read,Diversion)})
 same => n,Set(HISTORY_INFO=${PJSIP_HEADER(read,History-Info)})
 same => n,Set(PAI=${PJSIP_HEADER(read,P-Asserted-Identity)})
 same => n,NoOp(Forwarding Diversion Header: ${DIVERSION})
 same => n,NoOp(History-Info Header: ${HISTORY_INFO})
 same => n,Answer()
 same => n,Stasis(voice_agent_app,${CALLERID(num)},${DIVERSION},${PAI},${EXTEN})
 same => n,Hangup()

